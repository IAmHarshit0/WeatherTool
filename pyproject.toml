[project]
name = "adhokai-weather-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IAmHarshit0", email = "iamharshit237@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
adhokai-weather-tool = "adhokai_weather_tool:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]